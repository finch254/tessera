name: Build Tessera IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the newest Xcode available on the runner (no hard pin —
          # pinned versions like 15.3/15.4 get removed from runners).
          XCODE_APP=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Tessera.xcodeproj -scheme Tessera

      - name: Compile check (unsigned)
        run: |
          xcodebuild \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # --- Signed path (when DEVELOPMENT_TEAM is set) ---
      - name: Archive (signed)
        if: ${{ env.DEVELOPMENT_TEAM != '' }}
        run: |
          xcodebuild \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            archive \
            -archivePath $PWD/build/Tessera.xcarchive

      - name: Export IPA (signed)
        if: ${{ env.DEVELOPMENT_TEAM != '' }}
        run: |
          mkdir -p $PWD/build/export
          cat > $PWD/build/export/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>$DEVELOPMENT_TEAM</string>
              <key>uploadSymbols</key>
              <false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath $PWD/build/Tessera.xcarchive \
            -exportPath $PWD/build/export \
            -exportOptionsPlist $PWD/build/export/ExportOptions.plist

      - name: Upload IPA (signed)
        if: ${{ env.DEVELOPMENT_TEAM != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tessera-Debug
          path: build/export/*.ipa
          retention-days: 7

      # --- Unsigned path (when DEVELOPMENT_TEAM is NOT set) ---
      # Uses archive to ensure asset catalogs are compiled into Assets.car
      - name: Archive unsigned app
        if: ${{ env.DEVELOPMENT_TEAM == '' }}
        run: |
          mkdir -p build/unsigned
          xcodebuild \
            -project Tessera.xcodeproj \
            -scheme Tessera \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/unsigned/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            archive \
            -archivePath $PWD/build/unsigned/Tessera.xcarchive

      - name: Package unsigned IPA
        if: ${{ env.DEVELOPMENT_TEAM == '' }}
        run: |
          APP_PATH="build/unsigned/Tessera.xcarchive/Products/Applications/Tessera.app"
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"
          mkdir -p build/unsigned/Payload
          cp -r "$APP_PATH" build/unsigned/Payload/Tessera.app
          cd build/unsigned
          zip -r Tessera-Debug.ipa Payload
          ls -la Tessera-Debug.ipa

      - name: Upload unsigned IPA
        if: ${{ env.DEVELOPMENT_TEAM == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tessera-Debug
          path: build/unsigned/Tessera-Debug.ipa
          retention-days: 7
