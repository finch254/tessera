name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild -project Tessera.xcodeproj -scheme Tessera -destination 'platform=iOS Simulator,name=iPhone 15' build
      - name: Test
        run: xcodebuild -project Tessera.xcodeproj -scheme Tessera -destination 'platform=iOS Simulator,name=iPhone 15' test
